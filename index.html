<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokémon TCGP Pack Odds Calculator</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="/images/favicon.png" sizes="any"/>
</head>
<body>
  <main>
    <h1>Pokémon TCGP Pack Odds</h1>

    <section class="controls">
      <label>
        Select pack series
        <select id="pack-series-select">
          <option value="">-- Choose a pack --</option>
          <option value="b1a">Crimson Blaze (B1a)</option>
          <option value="b1al">Mega Risisng (Altaria) (B1)</option>
          <option value="b1bl">Mega Risisng (Blaziken) (B1)</option>
          <option value="b1gy">Mega Risisng (Gyarados) (B1)</option>
          <option value="a4a">Secluded Springs (A4a)</option>
          <option value="a4h">Wisdom of Sea and Sky (Ho-oh) (A4)</option>
          <option value="a4l">Wisdom of Sea and Sky (Lugia) (A4)</option>
          <option value="a3b">Eevee Grove (A3b)</option>
          <option value="a3a">Extradimensional Crisis (A3a)</option>
          <option value="a3s">Celestial Guardians (Solgaleo) (A3)</option>
          <option value="a3l">Celestial Guardians (Lunala) (A3)</option>
          <option value="a2b">Shining Revelry (A2b)</option>
          <option value="a2a">Triumphant Light (A2a)</option>
          <option value="a2d">Space-Time Smackdown (Dialga) (A2)</option>
          <option value="a2p">Space-Time Smackdown (Palkia) (A2)</option>
          <option value="a1a">Mythical Island (A1a)</option>
          <option value="a1p">Genetic Apex (Pikachu) (A1)</option>
          <option value="a1m">Genetic Apex (Mewtwo) (A1)</option>
          <option value="a1c">Genetic Apex (Charizard) (A1)</option>
        </select>
      </label>

      <label>
          Select card
          <div class="card-select-wrapper">
              <input 
                  type="text" 
                  id="card-search" 
                  placeholder="Search cards..." 
                  autocomplete="off"
              />
              <ul id="card-dropdown" class="card-dropdown"></ul>
          </div>
      </label>
    </section>

    <section class="results">
      <h2>Odds per pack</h2>
      <div id="result-container">
        <p id="result-text">Select a pack series to see rarity odds.</p>
      </div>
    </section>
  </main>

<script src="data/packs.js"></script>
<script src="data/sets/a1c.js"></script>

<script src="data/sets/a3b.js"></script>
<script src="data/sets/a4h.js"></script>
<script src="data/sets/a4l.js"></script>
<script src="data/sets/a4a.js"></script>
<script src="data/sets/b1al.js"></script>
<script src="data/sets/b1bl.js"></script>
<script src="data/sets/b1gy.js"></script>
<script src="data/sets/b1a.js"></script>
<script src="data/cards.js"></script>
<script src="script.js"></script>
</body>
</html>
