<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokémon TCGP Pack Odds Calculator</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="/images/favicon.png" sizes="any"
</head>
<body>
  <main>
    <h1>Pokémon TCGP Pack Odds</h1>

    <section class="controls">
      <label>
        Select pack series
        <select id="pack-series-select">
          <option value="">-- Choose a pack --</option>
          <option value="a1c">Genetic Apex (Charizard) (A1)</option>
          <option value="a1m">Genetic Apex (Mewtwo) (A1)</option>
          <option value="a1p">Genetic Apex (Pikachu) (A1)</option>
        </select>
      </label>

      <label>
          Select card
          <div class="card-select-wrapper">
              <input 
                  type="text" 
                  id="card-search" 
                  placeholder="Search cards..." 
                  autocomplete="off"
              />
              <ul id="card-dropdown" class="card-dropdown"></ul>
          </div>
      </label>
    </section>

    <section class="results">
      <h2>Odds per pack</h2>
      <div id="result-container">
        <p id="result-text">Select a pack series to see rarity odds.</p>
      </div>
    </section>
  </main>

<script src="data/packs.js"></script>
<script src="data/sets/a1c.js"></script>
<script src="data/sets/a1m.js"></script>
<script src="data/sets/a1p.js"></script>
<script src="data/cards.js"></script>
<script src="script.js"></script>
</body>
</html>
