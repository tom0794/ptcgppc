<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokémon TCGP Pack Odds Calculator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <h1>Pokémon TCGP Pack Odds</h1>

    <section class="controls">
      <label>
        Select pack series
        <select id="pack-series-select">
          <option value="">-- Choose a pack --</option>
          <option value="series-1">Series 1</option>
          <option value="series-2">Series 2</option>
          <option value="series-3">Series 3</option>
        </select>
      </label>

      <label>
        Select card
        <select id="card-select">
          <option value="">-- Choose a card --</option>
        </select>
      </label>
    </section>

    <section class="results">
      <h2>Odds per pack</h2>
      <div id="result-container">
        <p id="result-text">Select a pack series to see rarity odds.</p>
      </div>
    </section>
  </main>

  <script src="data/packs.js"></script>
  <script src="data/cards.js"></script>
  <script src="script.js"></script>
</body>
</html>
